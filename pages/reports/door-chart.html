<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Door Chart — Parikshya Sathi</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Apple Design System CSS -->
    <link rel="stylesheet" href="../../assets/css/design-system.css">
    <style>
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .page-break { page-break-after: always; break-after: page; }
            body { background-color: #fff !important; }
            .apple-card { border: 1px solid #000 !important; box-shadow: none !important; margin-bottom: 20px !important; }
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-4" style="max-width: 1100px;">
    <!-- Top Action Bar (hidden in print) -->
    <div class="no-print apple-card p-3 mb-4 d-flex justify-content-between align-items-center" style="background-color: var(--surface-pearl);">
        <div class="d-flex align-items-center gap-2">
            <a href="../reports.html" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Back
            </a>
            <div>
                <strong class="text-dark">Door Chart (A4 Print Layout)</strong>
                <div class="fine-print text-muted">Post outside exam halls for students to identify assigned symbol ranges.</div>
            </div>
        </div>
        <button onclick="window.print()" class="btn-apple-primary btn-sm">
            <i class="bi bi-printer me-1"></i> Print / Save PDF
        </button>
    </div>

    <!-- Print Only Institution Header -->
    <div class="print-only text-center mb-4 pb-3 border-bottom border-dark" style="display: none;">
        <h3 class="fw-bold text-uppercase mb-1">Examination Controller Board</h3>
        <h5 class="fw-semibold mb-1" id="print-event-title">EXAMINATION DOOR CHART</h5>
        <div class="small fw-medium" id="print-event-meta">Official Hall Notice</div>
    </div>

    <!-- Dynamic Room Door Charts Container -->
    <div id="door-charts-container">
        <div class="text-center text-muted py-5">
            <div class="spinner-border spinner-border-sm text-primary me-2"></div> Loading door charts...
        </div>
    </div>
</div>

<!-- Shared Scripts -->
<script src="../../assets/js/layout.js"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const urlParams = new URLSearchParams(window.location.search);
    const eventId = urlParams.get('event_id') || 1;

    try {
        const res = await AppLayout.api(`reports.php?event_id=${eventId}&type=door_chart`);
        const event = res.data.event;
        const doorChart = res.data.door_chart || {};

        document.title = `Door Chart — ${event.event_name}`;
        document.getElementById('print-event-title').innerText = event.event_name.toUpperCase();
        document.getElementById('print-event-meta').innerText = `${AppLayout.formatDate(event.event_date)} • ${event.start_time} - ${event.end_time}`;

        const container = document.getElementById('door-charts-container');
        const roomIds = Object.keys(doorChart);

        if (roomIds.length === 0) {
            container.innerHTML = `<div class="text-center text-muted py-5">No seated students found in this allocation.</div>`;
            return;
        }

        container.innerHTML = roomIds.map((rId, idx) => {
            const rData = doorChart[rId];
            const cohorts = rData.cohorts || {};
            let totalStudentsInRoom = 0;
            Object.values(cohorts).forEach(arr => totalStudentsInRoom += arr.length);

            return `
            <div class="apple-card p-4 mb-4 page-break bg-white" style="border: 2px solid var(--hairline);">
                <!-- Room Header -->
                <div class="d-flex justify-content-between align-items-center pb-3 mb-3 border-bottom border-2 border-dark">
                    <div>
                        <span class="badge-apple badge-apple-primary mb-1">EXAMINATION HALL</span>
                        <h2 class="display-lg mb-0 text-dark fw-bold fs-3">${rData.room_name}</h2>
                        <div class="caption text-muted">${rData.building} &bull; ${rData.floor}</div>
                    </div>
                    <div class="text-end">
                        <div class="body-strong fs-4 text-primary">${totalStudentsInRoom} Students</div>
                        <div class="fine-print text-muted">${AppLayout.formatDate(event.event_date)} (${event.start_time} – ${event.end_time})</div>
                    </div>
                </div>

                <!-- Symbol Number Ranges Grid -->
                <div class="row g-3 mb-4">
                    ${Object.entries(cohorts).map(([cName, stList]) => {
                        const firstSymbol = stList[0].symbol_no_snapshot;
                        const lastSymbol = stList[stList.length - 1].symbol_no_snapshot;
                        const subj = stList[0].subject_name_snapshot || 'Core Paper';
                        return `
                        <div class="col-12 col-md-6">
                            <div class="p-3 rounded-3" style="background-color: var(--surface-pearl); border: 1px solid var(--hairline);">
                                <div class="d-flex justify-content-between align-items-start mb-1">
                                    <span class="body-strong text-dark">${cName}</span>
                                    <span class="badge-apple badge-apple-primary">${stList.length} Students</span>
                                </div>
                                <div class="fine-print text-muted mb-2"><i class="bi bi-journal-text me-1"></i> ${subj}</div>
                                <div class="p-2 bg-white rounded-2 border text-center">
                                    <div class="fine-print text-muted text-uppercase mb-1">Assigned Symbol Range</div>
                                    <div class="fs-5 font-monospace fw-bold text-primary">
                                        ${firstSymbol} &mdash; ${lastSymbol}
                                    </div>
                                </div>
                            </div>
                        </div>
                        `;
                    }).join('')}
                </div>

                <!-- Detailed Symbol Roll for this Room -->
                <h5 class="tagline mb-2 fs-6">Student Roll for this Hall</h5>
                <div class="table-responsive">
                    <table class="table-apple" style="font-size: 13px;">
                        <thead>
                            <tr>
                                <th style="width: 120px;">Symbol No</th>
                                <th>Student Name</th>
                                <th>Program</th>
                                <th>Sem</th>
                                <th>Paper</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${Object.values(cohorts).flat().map(st => `
                                <tr>
                                    <td class="font-monospace fw-bold text-dark">${st.symbol_no_snapshot}</td>
                                    <td class="fw-semibold">${st.student_name_snapshot}</td>
                                    <td><span class="badge-apple badge-apple-primary py-0 px-1" style="font-size:11px;">${st.program_code_snapshot}</span></td>
                                    <td>Sem ${st.semester_snapshot}</td>
                                    <td class="fine-print text-muted">${st.subject_name_snapshot || '—'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
            `;
        }).join('');

    } catch (e) {
        console.error(e);
    }
});
</script>

</body>
</html>
