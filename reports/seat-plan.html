<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Seat Plan — Parikshya Sathi</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Apple Design System CSS -->
    <link rel="stylesheet" href="../assets/css/design-system.css">
    <style>
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .page-break { page-break-after: always; break-after: page; }
            body { background-color: #fff !important; }
            .apple-card { border: 1px solid #000 !important; box-shadow: none !important; margin: 0 !important; padding: 12px !important; }
            .furniture-bench { border: 1px solid #666 !important; background: #fff !important; }
            .seat-slot { border: 1px solid #999 !important; }
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-4" style="max-width: 1200px;">
    <!-- Top Action Bar (hidden in print) -->
    <div class="no-print apple-card p-3 mb-4 d-flex justify-content-between align-items-center" style="background-color: var(--surface-pearl);">
        <div class="d-flex align-items-center gap-2">
            <a href="../reports.html" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Back
            </a>
            <div id="room-nav-buttons" class="btn-group"></div>
        </div>
        <button onclick="window.print()" class="btn-apple-primary btn-sm">
            <i class="bi bi-printer me-1"></i> Print / Save PDF
        </button>
    </div>

    <!-- Printable Container -->
    <div class="apple-card p-4 page-break bg-white" style="border: 2px solid var(--hairline);">
        <!-- Document Header -->
        <div class="d-flex justify-content-between align-items-center pb-3 mb-3 border-bottom border-2 border-dark">
            <div>
                <span class="badge-apple badge-apple-primary mb-1">EXAM HALL SEAT PLAN</span>
                <h2 class="display-lg mb-0 text-dark fw-bold fs-3" id="plan-room-name">Loading Hall...</h2>
                <div class="caption text-muted" id="plan-room-meta">Examination Hall Schematic</div>
            </div>
            <div class="text-end">
                <div class="body-strong fs-4 text-primary" id="plan-student-tally">— Students</div>
                <div class="fine-print text-muted" id="plan-event-meta">—</div>
            </div>
        </div>

        <!-- Legend -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="fine-print text-muted"><i class="bi bi-person-workspace me-1"></i> Front of Examination Hall</div>
            <div class="d-flex flex-wrap gap-2 fine-print">
                <span class="d-flex align-items-center gap-1"><span style="width:12px; height:12px; background:#0066cc; border-radius:3px;"></span> BCA</span>
                <span class="d-flex align-items-center gap-1"><span style="width:12px; height:12px; background:#34c759; border-radius:3px;"></span> BSc.CSIT</span>
                <span class="d-flex align-items-center gap-1"><span style="width:12px; height:12px; background:#ff9500; border-radius:3px;"></span> BBM</span>
                <span class="d-flex align-items-center gap-1"><span style="width:12px; height:12px; background:#af52de; border-radius:3px;"></span> BBA</span>
            </div>
        </div>

        <!-- Seating Grid -->
        <div class="room-grid-canvas" id="plan-grid-container">
            <div class="text-center text-muted py-5">Loading seating matrix...</div>
        </div>
    </div>
</div>

<!-- Shared Scripts -->
<script src="../assets/js/layout.js"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const urlParams = new URLSearchParams(window.location.search);
    const eventId = urlParams.get('event_id') || 1;
    const roomId = urlParams.get('room_id') || null;

    await loadSeatPlan(eventId, roomId);
});

async function loadSeatPlan(eventId, roomId) {
    const query = new URLSearchParams({ event_id: eventId, type: 'seat_plan' });
    if (roomId) query.set('room_id', roomId);

    try {
        const res = await AppLayout.api(`reports.php?${query.toString()}`);
        const data = res.data;
        const event = data.event;
        const currentRoom = data.current_room;
        const rooms = data.rooms || [];
        const furniture = data.furniture || [];
        const seats = data.seats || [];
        const allocations = data.allocations || [];

        document.title = `Seat Plan — ${currentRoom.room_name}`;
        document.getElementById('plan-room-name').innerText = currentRoom.room_name;
        document.getElementById('plan-room-meta').innerText = `${currentRoom.building}, ${currentRoom.floor} • ${event.event_name}`;
        document.getElementById('plan-student-tally').innerText = `${allocations.length} Seated Students`;
        document.getElementById('plan-event-meta').innerText = `${AppLayout.formatDate(event.event_date)} (${event.start_time} – ${event.end_time})`;

        // Render Room switcher buttons
        const navContainer = document.getElementById('room-nav-buttons');
        navContainer.innerHTML = rooms.map(r => `
            <button class="btn btn-sm ${parseInt(r.id, 10) === parseInt(currentRoom.id, 10) ? 'btn-primary' : 'btn-outline-secondary'}" onclick="loadSeatPlan(${eventId}, ${r.id})">
                ${r.room_name}
            </button>
        `).join('');

        // Map allocations by seat_id
        const allocBySeatId = {};
        allocations.forEach(a => { allocBySeatId[a.seat_id] = a; });

        // Map seats by furniture_id
        const seatsByFurn = {};
        seats.forEach(s => {
            if (!seatsByFurn[s.furniture_id]) seatsByFurn[s.furniture_id] = [];
            seatsByFurn[s.furniture_id].push(s);
        });

        let html = `
        <div class="teacher-podium mb-4">
            <i class="bi bi-person-workspace me-1"></i> Invigilator Desk / Blackboard (Front)
        </div>
        <div class="d-flex flex-column gap-3">
        `;

        for (let r = 1; r <= currentRoom.rows_count; r++) {
            html += `<div class="d-flex gap-3 justify-content-center align-items-center">
                <span class="badge bg-secondary rounded-pill" style="font-size:11px; width:55px;">Row ${r}</span>
                <div class="row g-2 flex-grow-1">`;

            for (let c = 1; c <= currentRoom.cols_count; c++) {
                const furn = furniture.find(f => parseInt(f.row_num, 10) === r && parseInt(f.col_num, 10) === c);
                const furnSeats = furn ? (seatsByFurn[furn.id] || []) : [];

                html += `<div class="col">
                    <div class="furniture-bench p-2">
                        <div class="fine-print fw-bold text-center mb-1 text-muted">Desk ${r}-${c}</div>
                        <div class="d-flex gap-1 justify-content-center">`;

                furnSeats.forEach(st => {
                    const alloc = allocBySeatId[st.id] || null;
                    const pCode = alloc ? alloc.program_code_snapshot.toLowerCase().replace('.', '') : '';

                    html += `
                    <div class="seat-slot ${alloc ? 'occupied occupied-' + pCode : ''} p-2 flex-fill text-center" style="min-height:58px;">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <span class="fine-print fw-bold text-muted" style="font-size:10px;">${st.seat_identifier}</span>
                            ${alloc ? `<span class="badge-apple badge-apple-primary py-0 px-1" style="font-size:9px;">${alloc.program_code_snapshot}</span>` : ''}
                        </div>
                        ${alloc ? `
                            <div class="fw-bold font-monospace text-dark" style="font-size:12px;">${alloc.symbol_no_snapshot}</div>
                            <div class="text-truncate fine-print text-muted" style="max-width:90px;font-size:11px;">${alloc.student_name_snapshot}</div>
                        ` : `
                            <div class="text-muted fine-print py-1" style="font-size:11px;">— Empty —</div>
                        `}
                    </div>
                    `;
                });

                html += `</div></div></div>`;
            }

            html += `</div></div>`;
        }

        html += `</div>`;
        document.getElementById('plan-grid-container').innerHTML = html;

    } catch (e) {
        console.error(e);
    }
}
</script>

</body>
</html>
